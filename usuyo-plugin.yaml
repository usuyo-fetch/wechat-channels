# 微信视频号获取插件（usuyo 插件协议 v1）。设计见 usuyo 仓库 docs/platforms/wechat-channels.md §3。
protocol: 1
id: usuyo-fetch/wechat-channels
kind: fetch
name: 微信视频号
description: >-
  用手机上「分享 → 复制链接」得到的视频号链接取一条，用于个人备份、离线阅读。
  不用账号存作者、描述和封面；视频文件另是一种方法，用你登录的腾讯元宝换一个临时凭证去取。
version: 0.1.0
license: MIT
maintainers: [Fldicoahkiin]
upstream:
  - name: ParseHub（移植 provider_api/wxchannels.py 的请求和解析）
    url: https://github.com/z-mio/ParseHub
    license: MIT
platforms: [wechat-channels]
match: ["weixin.qq.com/sph/*", "channels.weixin.qq.com/finder-preview/pages/*"]
sites:
  - site: yuanbao.tencent.com
    name: 腾讯元宝
    credential: cookies
    loginUrl: https://yuanbao.tencent.com/
    # 登录后才有的 cookie 名还没核实，所以先不写 `cookies`
# 几种方法各列一项（usuyo 协议 §2.3.1），没做的也列；行和 usuyo 仓库 docs/platforms/routes.md 第 4 节一一对应
# （改客户端的 `wxcd` 在另一个组织）。
methods:
  - id: feed-info
    name: 分享页接口
    access: public-web
    login: none
    account: none
    risk:
      text: 匿名接口给的字段在收紧
      source: {label: "usuyo platforms/wechat-channels.md §3.2", url: "https://github.com/usuyo/usuyo/blob/main/docs/platforms/wechat-channels.md#32-取单条"}
    capabilities:
      fetch:
        outputs: [text, images, meta]
  - id: yuanbao
    name: 腾讯元宝换视频
    access: session-api
    login: required
    account: in-usuyo
    sites: [yuanbao.tencent.com]
    risk:
      text: 公开部署的解析服务被大量调用后，元宝账号被封
      source: {label: "wx_channels_download #495", url: "https://github.com/ltaoo/wx_channels_download/issues/495"}
    capabilities:
      fetch:
        timeout: 30m
        outputs: [media:video]
  - id: userscript
    name: 网页版的浏览器脚本
    built: false
    access: browser-session
    login: required
    account: own-browser
    delivers: links
  - id: iphone
    name: iPhone 镜像
    built: false
    access: vision-ui
    login: required
    account: own-phone
    interaction: foreground
    drives: iphone
    capabilities:
      list:
        sources:
          - {source: "wechat-channels:liked", title: 赞和收藏, action: favorite}
    risk:
      text: 微信协议 8.2.1.6 禁止用第三方软件读界面、自动操作；镜像没有处罚报告
      source: {label: "调研 06 §1.2", url: "https://github.com/usuyo/usuyo/blob/main/docs/research/06-platform-access-and-account-risk.md#12-视觉层的风险从哪里来"}
  - id: mac
    name: 电脑微信
    built: false
    access: vision-ui
    login: required
    account: own-app
    interaction: foreground
    drives: desktop-app
    capabilities:
      list:
        sources:
          - {source: "wechat-channels:liked", title: 赞和收藏, action: favorite}
  - id: android
    name: 安卓手机
    built: false
    access: vision-ui
    login: required
    account: own-phone
    interaction: foreground
    drives: android
    capabilities:
      list:
        sources:
          - {source: "wechat-channels:liked", title: 赞和收藏, action: favorite}
  - id: audio
    name: 录下口播
    built: false
    access: vision-ui
    login: required
    account: own-phone
    drives: iphone
    interaction: foreground
    # 录的是 iPhone 镜像播放时的声音（routes.md 第 4 节先写的那一样）；录电脑微信的要另写一种 `own-app` 的方法
    capabilities:
      fetch:
        outputs: [media:audio]
pacing:
  wechat-channels: {batch: true, interval: 30s, daily: 50}
permissions:
  fs:
    write: ["${OUT}"]
  network:
    mode: allowlist
    # 视频和封面所在的 CDN 主机名没有核实，先放行 *.qq.com；插件自己也只从 *.qq.com 的 https 地址下载
    hosts: ["channels.weixin.qq.com", "yuanbao.tencent.com", "*.qq.com"]
  env: []
  devices: []
  gpu: false
  limits: {memory: 512MiB}
run:
  command: ["${PLUGIN_DIR}/usuyo-fetch-wechat-channels"]
