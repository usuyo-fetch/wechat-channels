[package]
name = "usuyo-fetch-wechat-channels"
description = "usuyo 的微信视频号获取插件：分享链接取作者、描述、封面，可选借腾讯元宝的登录取视频"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/usuyo-fetch/wechat-channels"
publish = false

[[bin]]
name = "usuyo-fetch-wechat-channels"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
jiff = "0.2.42"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
url = "2.5.8"
usuyo-plugin-kit = { path = "../../usuyo/crates/usuyo-plugin-kit" }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
usuyo-plugin = { path = "../../usuyo/crates/usuyo-plugin" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
